<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meja Redaksi BICH</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #05070c; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    .tab-btn.active { background: #059669; color: white; }
    textarea { resize: vertical; }
</style>
</head>
<body class="text-white min-h-screen">

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-[#0b0f17] border border-slate-800 rounded-2xl p-8 space-y-5">
        <h1 class="text-xl font-bold flex items-center gap-2">🔒 Login Meja Redaksi BICH</h1>
        <input id="login-password" type="password" placeholder="Masukkan Password Admin"
               class="w-full bg-[#080c14] border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        <button id="login-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 transition rounded-lg py-2.5 text-sm font-bold">Masuk</button>
        <p id="login-error" class="text-red-400 text-xs hidden">❌ Password salah, Bolo.</p>
    </div>
</div>

<!-- ===================== APP SCREEN ===================== -->
<div id="app-screen" class="hidden max-w-[1400px] mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">📰 Meja Redaksi BICH <span class="text-xs font-mono text-slate-500">— HTML Edition</span></h1>
        <div class="flex items-center gap-3">
            <button id="refresh-btn" class="text-xs font-mono border border-slate-700 hover:border-emerald-500 rounded-lg px-3 py-1.5 transition">🔄 Refresh</button>
            <button id="logout-btn" class="text-xs font-mono text-slate-500 hover:text-white transition">Keluar</button>
        </div>
    </div>

    <div id="tabs" class="flex flex-wrap gap-2 mb-6"></div>
    <div id="loading-indicator" class="text-center py-10 font-mono text-sm text-slate-500 hidden">⏳ Memuat antrean...</div>
    <div id="tab-content"></div>
</div>

<script>
const API = ''; // same origin (server FastAPI menyajikan halaman ini juga)
let TOKEN = localStorage.getItem('bich_redaksi_token') || '';
let QUEUE = [];
let ACTIVE_TAB = 'loker';

const TABS = [
    { key: 'loker',         label: '💼 Loker',                    kategori: 'Loker',        requireAiReady: false },
    { key: 'ekonomi',       label: '📈 Ekonomi (Mingguan)',        kategori: 'Ekonomi',      requireAiReady: true  },
    { key: 'wisata',        label: '🌴 Pariwisata',                kategori: 'Pariwisata',   requireAiReady: false },
    { key: 'berita',        label: '📰 Berita',                    kategori: 'Berita',       requireAiReady: true  },
    { key: 'edukasi',       label: '📚 Edukasi',                   kategori: 'Edukasi',      requireAiReady: false },
    { key: 'politik',       label: '🏛️ Politik (Mingguan)',        kategori: 'Politik',      requireAiReady: true  },
    { key: 'pasar_modal',   label: '📊 Pasar Modal',               kategori: 'Pasar Modal',  requireAiReady: false },
    { key: 'tokoh_politik', label: '🎤 Panggung Tokoh',            kategori: 'Tokoh Politik',requireAiReady: false },
    { key: 'tarif_travel',  label: '🧭 Tarif Travel',              special: true },
    { key: 'mitra',         label: '🚐 Mitra & Pencairan',         special: true },
];

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

function isAiReady(item) {
    return !!(item.artikel_ai && String(item.artikel_ai).trim() !== '');
}

// ------------------ AUTH ------------------
async function doLogin() {
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.add('hidden');
    try {
        const res = await fetch(`${API}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            // Tampilkan pesan asli dari server (mis. "Terlalu banyak percobaan
            // login gagal, coba lagi dalam X detik") - bukan cuma "unauthorized"
            // generik, supaya jelas kalau sedang kena rate limit vs password salah.
            errEl.textContent = data.detail || 'Password salah, Bolo.';
            errEl.classList.remove('hidden');
            return;
        }
        TOKEN = data.token;
        localStorage.setItem('bich_redaksi_token', TOKEN);
        showApp();
    } catch (e) {
        errEl.textContent = 'Gagal terhubung ke server.';
        errEl.classList.remove('hidden');
    }
}

async function logout() {
    // DIPERBAIKI: sebelumnya cuma hapus token di localStorage - token itu
    // sendiri TETAP SAH di server sampai server restart. Sekarang panggil
    // /api/logout dulu supaya token beneran dicabut di server. Dibuat
    // "best-effort" (tetap logout di UI walau request ini gagal, mis. lagi
    // offline) supaya pengguna tidak terjebak tidak bisa logout.
    try {
        await fetch(`${API}/api/logout`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${TOKEN}` },
        });
    } catch (e) {
        console.warn('Gagal mencabut token di server (tetap logout di browser):', e);
    }
    TOKEN = '';
    localStorage.removeItem('bich_redaksi_token');
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
}

async function apiFetch(path, options = {}) {
    const res = await fetch(`${API}${path}`, {
        ...options,
        headers: {
            ...(options.headers || {}),
            'Authorization': `Bearer ${TOKEN}`,
            ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        },
    });
    if (res.status === 401) {
        logout();
        throw new Error('Sesi habis, silakan login ulang.');
    }
    if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || 'Terjadi kesalahan.');
    }
    return res.json();
}

// ------------------ QUEUE ------------------
async function loadQueue() {
    document.getElementById('loading-indicator').classList.remove('hidden');
    try {
        QUEUE = await apiFetch('/api/queue');
    } catch (e) {
        alert('Gagal memuat antrean: ' + e.message);
        QUEUE = [];
    }
    document.getElementById('loading-indicator').classList.add('hidden');
    renderTabs();
    renderActiveTab();
}

function renderTabs() {
    const container = document.getElementById('tabs');
    container.innerHTML = TABS.map(t => {
        const countLabel = t.special ? '' : ` <span class="opacity-60">(${QUEUE.filter(d => d.kategori === t.kategori && (!t.requireAiReady || isAiReady(d))).length})</span>`;
        return `<button data-tab="${t.key}" class="tab-btn ${t.key === ACTIVE_TAB ? 'active' : ''} text-xs font-mono border border-slate-800 rounded-lg px-3 py-2 transition hover:border-emerald-500">
            ${t.label}${countLabel}
        </button>`;
    }).join('');
    container.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => { ACTIVE_TAB = btn.dataset.tab; renderTabs(); renderActiveTab(); };
    });
}

function renderActiveTab() {
    const tabDef = TABS.find(t => t.key === ACTIVE_TAB);
    const content = document.getElementById('tab-content');

    if (tabDef.key === 'tarif_travel') { renderTarifPanel(content); return; }
    if (tabDef.key === 'mitra') { renderMitraPanel(content); return; }

    const items = QUEUE.filter(d => d.kategori === tabDef.kategori && (!tabDef.requireAiReady || isAiReady(d)));

    if (items.length === 0) {
        content.innerHTML = `<div class="text-center py-16 text-slate-500 font-mono text-sm">✨ Antrean ${escapeHtml(tabDef.kategori)} bersih, Bolo.</div>`;
        return;
    }
    content.innerHTML = `<div class="space-y-4">${items.map(item => renderItemCard(item, tabDef.key)).join('')}</div>`;
    items.forEach(item => wireItemCard(item, tabDef.key));
}

// ------------------ PANEL: TARIF TRAVEL (admin-editable) ------------------
async function renderTarifPanel(content) {
    content.innerHTML = `<div class="text-center py-10 font-mono text-sm text-slate-500">⏳ Memuat tarif...</div>`;
    try {
        const [rute, layanan] = await Promise.all([
            apiFetch('/api/tarif-rute'),
            apiFetch('/api/tarif-layanan'),
        ]);

        content.innerHTML = `
        <div class="space-y-6">
            <div class="bg-[#0b0f17] border border-slate-800 rounded-xl p-5">
                <h3 class="font-bold text-white mb-1">🧭 Tarif per Rute</h3>
                <p class="text-xs text-slate-500 mb-4">route_key format: ORIGIN_DESTINATION (mis. BPN_IKN). "DEFAULT" dipakai untuk rute yang belum ada harga khususnya, "AIRPORT" untuk rute yang melibatkan bandara.</p>
                <div id="tarif-rute-rows" class="space-y-2"></div>
                <div class="flex gap-2 mt-4 pt-4 border-t border-slate-800">
                    <input id="new-route-key" placeholder="ROUTE_KEY baru (mis. SMD_PKY)" class="flex-1 bg-[#080c14] border border-slate-700 rounded px-3 py-2 text-xs font-mono">
                    <input id="new-route-harga" type="number" placeholder="Harga (Rp)" class="w-32 bg-[#080c14] border border-slate-700 rounded px-3 py-2 text-xs font-mono">
                    <button id="btn-add-route" class="bg-emerald-600 hover:bg-emerald-500 rounded px-4 py-2 text-xs font-bold">+ Tambah Rute</button>
                </div>
            </div>

            <div class="bg-[#0b0f17] border border-slate-800 rounded-xl p-5">
                <h3 class="font-bold text-white mb-1">🚐 Multiplier per Jenis Layanan</h3>
                <p class="text-xs text-slate-500 mb-4">"multiplier" = tarif rute × nilai ini. "flat" = abaikan tarif rute, pakai nilai ini langsung (contoh: speedboat).</p>
                <div id="tarif-layanan-rows" class="space-y-2"></div>
            </div>
        </div>`;

        const ruteContainer = document.getElementById('tarif-rute-rows');
        rute.forEach(r => {
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 text-xs';
            row.innerHTML = `
                <span class="w-32 font-mono text-slate-400 truncate">${escapeHtml(r.route_key)}</span>
                <input type="number" value="${r.harga}" class="route-harga-input flex-1 bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 font-mono">
                <input type="text" value="${escapeHtml(r.keterangan || '')}" placeholder="keterangan" class="route-ket-input flex-1 bg-[#080c14] border border-slate-700 rounded px-2 py-1.5">
                <button class="btn-save-route bg-slate-800 hover:bg-emerald-700 rounded px-3 py-1.5 font-bold">Simpan</button>
                <button class="btn-del-route bg-red-950/40 border border-red-900 hover:border-red-500 rounded px-2 py-1.5">🗑️</button>
            `;
            row.querySelector('.btn-save-route').onclick = async () => {
                const harga = parseInt(row.querySelector('.route-harga-input').value) || 0;
                const keterangan = row.querySelector('.route-ket-input').value;
                await apiFetch('/api/tarif-rute', { method: 'POST', body: JSON.stringify({ route_key: r.route_key, harga, keterangan }) });
                alert('Tarif ' + r.route_key + ' disimpan.');
            };
            row.querySelector('.btn-del-route').onclick = async () => {
                if (!confirm(`Hapus rute ${r.route_key}?`)) return;
                await apiFetch(`/api/tarif-rute/${r.route_key}`, { method: 'DELETE' });
                renderTarifPanel(content);
            };
            ruteContainer.appendChild(row);
        });

        document.getElementById('btn-add-route').onclick = async () => {
            const route_key = document.getElementById('new-route-key').value.trim().toUpperCase();
            const harga = parseInt(document.getElementById('new-route-harga').value) || 0;
            if (!route_key || !harga) { alert('Isi route_key dan harga.'); return; }
            await apiFetch('/api/tarif-rute', { method: 'POST', body: JSON.stringify({ route_key, harga, keterangan: '' }) });
            renderTarifPanel(content);
        };

        const layananContainer = document.getElementById('tarif-layanan-rows');
        layanan.forEach(l => {
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 text-xs';
            row.innerHTML = `
                <span class="w-24 font-mono text-slate-400">${escapeHtml(l.service_type)}</span>
                <select class="layanan-tipe-input bg-[#080c14] border border-slate-700 rounded px-2 py-1.5">
                    <option value="multiplier" ${l.tipe === 'multiplier' ? 'selected' : ''}>multiplier</option>
                    <option value="flat" ${l.tipe === 'flat' ? 'selected' : ''}>flat</option>
                </select>
                <input type="number" step="0.01" value="${l.nilai}" class="layanan-nilai-input w-28 bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 font-mono">
                <input type="text" value="${escapeHtml(l.unit_label)}" class="layanan-unit-input flex-1 bg-[#080c14] border border-slate-700 rounded px-2 py-1.5">
                <button class="btn-save-layanan bg-slate-800 hover:bg-emerald-700 rounded px-3 py-1.5 font-bold">Simpan</button>
            `;
            row.querySelector('.btn-save-layanan').onclick = async () => {
                const tipe = row.querySelector('.layanan-tipe-input').value;
                const nilai = parseFloat(row.querySelector('.layanan-nilai-input').value) || 0;
                const unit_label = row.querySelector('.layanan-unit-input').value;
                await apiFetch('/api/tarif-layanan', { method: 'POST', body: JSON.stringify({ service_type: l.service_type, tipe, nilai, unit_label }) });
                alert('Layanan ' + l.service_type + ' disimpan.');
            };
            layananContainer.appendChild(row);
        });

    } catch (e) {
        content.innerHTML = `<div class="text-center py-16 text-red-400 font-mono text-sm">Gagal memuat: ${escapeHtml(e.message)}</div>`;
    }
}

// ------------------ PANEL: MITRA & ANTREAN PENCAIRAN ------------------
async function renderMitraPanel(content) {
    content.innerHTML = `<div class="text-center py-10 font-mono text-sm text-slate-500">⏳ Memuat data mitra...</div>`;
    try {
        const [mitraList, payoutQueue, mitraKurirList, menungguAssign, sedangBerjalan, disputeAktif] = await Promise.all([
            apiFetch('/api/mitra'),
            apiFetch('/api/payout-queue'),
            apiFetch('/api/mitra-kurir'),
            apiFetch('/api/transaksi-menunggu-assign'),
            apiFetch('/api/transaksi-berjalan'),
            apiFetch('/api/transaksi-dispute-aktif'),
        ]);

        const mitraTerverifikasi = mitraList.filter(m => m.status_verifikasi === 'TERVERIFIKASI');
        const rupiah = (n) => 'Rp' + Number(n || 0).toLocaleString('id-ID');

        content.innerHTML = `
        <div class="space-y-6">

            <div class="bg-[#0b0f17] border border-red-800/40 rounded-xl p-5">
                <h3 class="font-bold text-white mb-1">⚠️ Dispute Aktif</h3>
                <p class="text-xs text-slate-500 mb-4">Transaksi dengan sengketa yang menunggu diselesaikan. Payout diblokir otomatis sampai ini diselesaikan.</p>
                <div id="dispute-rows" class="space-y-2">${disputeAktif.length === 0 ? '<p class="text-xs text-slate-500">Tidak ada dispute aktif.</p>' : ''}</div>
            </div>

            <div class="bg-[#0b0f17] border border-slate-800 rounded-xl p-5">
                <h3 class="font-bold text-white mb-1">🧾 Menunggu Assign Mitra</h3>
                <p class="text-xs text-slate-500 mb-4">Pembayaran sudah SUCCESS, belum ditugaskan ke mitra manapun.</p>
                <div id="assign-rows" class="space-y-2">${menungguAssign.length === 0 ? '<p class="text-xs text-slate-500">Tidak ada transaksi menunggu assign.</p>' : ''}</div>
            </div>

            <div class="bg-[#0b0f17] border border-slate-800 rounded-xl p-5">
                <h3 class="font-bold text-white mb-1">🚦 Sedang Berjalan</h3>
                <p class="text-xs text-slate-500 mb-4">Sudah ditugaskan ke mitra, atau sudah selesai tapi masih dalam jendela sengketa 18 jam.</p>
                <div id="berjalan-rows" class="space-y-2">${sedangBerjalan.length === 0 ? '<p class="text-xs text-slate-500">Tidak ada transaksi berjalan.</p>' : ''}</div>
            </div>

            <div class="bg-[#0b0f17] border border-amber-800/40 rounded-xl p-5">
                <div class="flex items-center justify-between mb-1">
                    <h3 class="font-bold text-white">💸 Antrean Pencairan (T+1)</h3>
                    <button id="btn-hitung-ulang" class="text-xs font-mono border border-slate-700 hover:border-emerald-500 rounded-lg px-3 py-1.5 transition">🔄 Hitung Ulang Sekarang</button>
                </div>
                <p class="text-xs text-slate-500 mb-4">Layanan sudah SELESAI dan lewat jendela sengketa 18 jam - nominal sudah dihitung otomatis (fee sesuai komisi masing-masing mitra), siap ditransfer manual ke rekening mitra.</p>
                <div id="payout-rows" class="space-y-2">${payoutQueue.length === 0 ? '<p class="text-xs text-slate-500">Tidak ada antrean pencairan saat ini.</p>' : ''}</div>
            </div>

            <div class="bg-[#0b0f17] border border-slate-800 rounded-xl p-5">
                <h3 class="font-bold text-white mb-1">📋 Catat Dispute Pasca-Bayar</h3>
                <p class="text-xs text-slate-500 mb-4">
                    Khusus buat transaksi yang payout-nya SUDAH DIBAYAR ke mitra, tapi ada laporan
                    masalah masuk belakangan. Ini TIDAK membatalkan atau menarik kembali dana yang
                    sudah ditransfer (itu harus dikejar manual langsung ke mitra) - cuma memastikan
                    laporannya tercatat, tidak hilang begitu saja.
                </p>
                <div class="flex flex-wrap items-center gap-2">
                    <input type="text" id="dpb-id-transaksi" placeholder="ID transaksi (mis. TR-XXXXX)" class="bg-[#05070a] border border-slate-700 rounded px-2 py-1.5 text-xs font-mono w-48">
                    <input type="text" id="dpb-catatan" placeholder="Catatan / laporan dispute" class="flex-1 bg-[#05070a] border border-slate-700 rounded px-2 py-1.5 text-xs min-w-[200px]">
                    <button id="btn-catat-dispute-pasca-bayar" class="bg-red-950/40 border border-red-900 hover:border-red-500 rounded px-3 py-1.5 text-xs font-bold">Catat</button>
                </div>
            </div>

            <div class="bg-[#0b0f17] border border-slate-800 rounded-xl p-5">
                <h3 class="font-bold text-white mb-3">🚐 Daftar Mitra Transportasi</h3>
                <div id="mitra-rows" class="space-y-3"></div>
            </div>
            <div class="bg-[#0b0f17] border border-emerald-800/40 rounded-xl p-5">
                <h3 class="font-bold text-white mb-1">🛵 Daftar Mitra Kurir (Sungai Barito)</h3>
                <p class="text-xs text-slate-500 mb-4">Daftar mandiri lewat market/driver.html - data profil & rekening diisi mitra sendiri, di sini cuma approve/tolak.</p>
                <div id="mitra-kurir-rows" class="space-y-3">${mitraKurirList.length === 0 ? '<p class="text-xs text-slate-500">Belum ada pendaftar.</p>' : ''}</div>
            </div>
        </div>`;

        // --- DISPUTE AKTIF ---
        const disputeContainer = document.getElementById('dispute-rows');
        disputeAktif.forEach(d => {
            const row = document.createElement('div');
            row.className = 'bg-[#080c14] border border-red-900/60 rounded-lg p-3 text-xs space-y-2';
            row.innerHTML = `
                <p class="font-bold text-slate-200">${escapeHtml(d.id_transaksi)} — ${escapeHtml(d.nama_produk || '')}</p>
                <p class="text-slate-500 font-mono">${rupiah(d.total_harga)} | Selesai: ${d.selesai_at ? new Date(d.selesai_at).toLocaleString('id-ID') : '- (belum selesai)'}</p>
                <p class="text-red-300">Alasan: ${escapeHtml(d.dispute_alasan || '-')}</p>
                <div class="flex gap-2 pt-1">
                    <button class="btn-lanjut-bayar bg-emerald-700 hover:bg-emerald-600 rounded px-3 py-1.5 font-bold">✓ Lanjut Bayar</button>
                    <button class="btn-batalkan-payout bg-red-950/40 border border-red-900 hover:border-red-500 rounded px-3 py-1.5">🗑️ Batalkan Payout</button>
                </div>
            `;
            row.querySelector('.btn-lanjut-bayar').onclick = async () => {
                if (!confirm(`Selesaikan dispute ${d.id_transaksi} dan lanjutkan proses payout normal?`)) return;
                try {
                    await apiFetch('/api/transaksi/dispute-selesai', { method: 'POST', body: JSON.stringify({ id_transaksi: d.id_transaksi, hasil: 'LANJUT_BAYAR' }) });
                    renderMitraPanel(content);
                } catch (e) { alert('Gagal: ' + e.message); }
            };
            row.querySelector('.btn-batalkan-payout').onclick = async () => {
                if (!confirm(`Batalkan payout untuk ${d.id_transaksi} secara PERMANEN? Mitra tidak akan menerima pembayaran untuk transaksi ini.`)) return;
                try {
                    await apiFetch('/api/transaksi/dispute-selesai', { method: 'POST', body: JSON.stringify({ id_transaksi: d.id_transaksi, hasil: 'BATALKAN_PAYOUT' }) });
                    renderMitraPanel(content);
                } catch (e) { alert('Gagal: ' + e.message); }
            };
            disputeContainer.appendChild(row);
        });

        // --- MENUNGGU ASSIGN MITRA ---
        const assignContainer = document.getElementById('assign-rows');
        menungguAssign.forEach(t => {
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between text-xs bg-[#080c14] border border-slate-800 rounded-lg p-3 gap-3 flex-wrap';
            const opsiMitra = mitraTerverifikasi.map(m => `<option value="${m.id}">${escapeHtml(m.nama)} (komisi ${m.komisi_platform_persen}%)</option>`).join('');
            row.innerHTML = `
                <div>
                    <p class="font-bold text-slate-200">${escapeHtml(t.id_transaksi)} — ${escapeHtml(t.nama_produk || '')}</p>
                    <p class="text-slate-500 font-mono">${escapeHtml(t.nama_pelanggan || '-')} | ${rupiah(t.total_harga)}</p>
                </div>
                <div class="flex items-center gap-2">
                    <select class="assign-mitra-select bg-[#05070a] border border-slate-700 rounded px-2 py-1.5">
                        <option value="">${mitraTerverifikasi.length === 0 ? '(belum ada mitra terverifikasi)' : '-- pilih mitra --'}</option>
                        ${opsiMitra}
                    </select>
                    <button class="btn-assign bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1.5 font-bold" ${mitraTerverifikasi.length === 0 ? 'disabled' : ''}>Tugaskan</button>
                </div>
            `;
            row.querySelector('.btn-assign').onclick = async () => {
                const mitraId = row.querySelector('.assign-mitra-select').value;
                if (!mitraId) { alert('Pilih mitra dulu.'); return; }
                try {
                    await apiFetch('/api/transaksi/assign-mitra', { method: 'POST', body: JSON.stringify({ id_transaksi: t.id_transaksi, mitra_id: mitraId }) });
                    renderMitraPanel(content);
                } catch (e) { alert('Gagal: ' + e.message); }
            };
            assignContainer.appendChild(row);
        });

        // --- SEDANG BERJALAN (DITUGASKAN, atau SELESAI tapi belum DIJADWALKAN) ---
        const berjalanContainer = document.getElementById('berjalan-rows');
        sedangBerjalan.forEach(t => {
            const sudahSelesai = t.status_layanan === 'SELESAI';
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between text-xs bg-[#080c14] border border-slate-800 rounded-lg p-3 gap-3 flex-wrap';
            row.innerHTML = `
                <div>
                    <p class="font-bold text-slate-200">${escapeHtml(t.id_transaksi)} — ${escapeHtml(t.nama_produk || '')}</p>
                    <p class="text-slate-500 font-mono">Status: ${escapeHtml(t.status_layanan)}${sudahSelesai ? ` | Batas sengketa: ${new Date(t.dispute_deadline).toLocaleString('id-ID')}` : ''}</p>
                </div>
                <div class="flex items-center gap-2">
                    ${!sudahSelesai ? '<button class="btn-tandai-selesai bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1.5 font-bold">✓ Tandai Selesai</button>' : '<span class="text-slate-500 font-mono text-[11px]">Menunggu jendela sengketa lewat</span>'}
                    <button class="btn-ajukan-dispute bg-red-950/40 border border-red-900 hover:border-red-500 rounded px-3 py-1.5">⚠ Ajukan Dispute</button>
                </div>
            `;
            const selesaiBtn = row.querySelector('.btn-tandai-selesai');
            if (selesaiBtn) {
                selesaiBtn.onclick = async () => {
                    if (!confirm(`Tandai ${t.id_transaksi} sebagai selesai? Jendela sengketa 18 jam akan mulai berjalan sejak sekarang.`)) return;
                    try {
                        await apiFetch('/api/transaksi/selesai', { method: 'POST', body: JSON.stringify({ id_transaksi: t.id_transaksi }) });
                        renderMitraPanel(content);
                    } catch (e) { alert('Gagal: ' + e.message); }
                };
            }
            row.querySelector('.btn-ajukan-dispute').onclick = async () => {
                const alasan = prompt(`Alasan dispute untuk ${t.id_transaksi} (mis. laporan dari pelanggan lewat WA):`);
                if (!alasan || !alasan.trim()) return;
                try {
                    await apiFetch('/api/transaksi/dispute', { method: 'POST', body: JSON.stringify({ id_transaksi: t.id_transaksi, alasan: alasan.trim() }) });
                    renderMitraPanel(content);
                } catch (e) { alert('Gagal: ' + e.message); }
            };
            berjalanContainer.appendChild(row);
        });

        // --- TOMBOL HITUNG ULANG ANTREAN PENCAIRAN (manual trigger, jaga-jaga kalau pg_cron belum aktif) ---
        document.getElementById('btn-hitung-ulang').onclick = async () => {
            const btn = document.getElementById('btn-hitung-ulang');
            btn.disabled = true; btn.textContent = '⏳ Menghitung...';
            try {
                const res = await apiFetch('/api/transaksi/hitung-dijadwalkan', { method: 'POST' });
                alert(`Selesai. ${(res.diproses || []).length} transaksi dipindah ke antrean pencairan.`);
                renderMitraPanel(content);
            } catch (e) {
                alert('Gagal: ' + e.message);
                btn.disabled = false; btn.textContent = '🔄 Hitung Ulang Sekarang';
            }
        };

        // --- CATAT DISPUTE PASCA-BAYAR ---
        // Form manual (bukan listing tabel) karena belum ada daftar transaksi
        // ber-status DIBAYAR di panel ini - cukup jarang terjadi buat butuh
        // listing sendiri, admin sudah pegang id_transaksi dari laporan WA.
        document.getElementById('btn-catat-dispute-pasca-bayar').onclick = async () => {
            const idTransaksi = document.getElementById('dpb-id-transaksi').value.trim();
            const catatan = document.getElementById('dpb-catatan').value.trim();
            if (!idTransaksi || !catatan) { alert('Isi ID transaksi dan catatan dulu.'); return; }
            if (!confirm(`Catat dispute pasca-bayar untuk ${idTransaksi}? Ini TIDAK membatalkan dana yang sudah ditransfer - cuma mencatat laporannya.`)) return;
            try {
                await apiFetch('/api/transaksi/dispute-pasca-bayar', { method: 'POST', body: JSON.stringify({ id_transaksi: idTransaksi, catatan }) });
                alert('Tercatat.');
                document.getElementById('dpb-id-transaksi').value = '';
                document.getElementById('dpb-catatan').value = '';
            } catch (e) { alert('Gagal: ' + e.message); }
        };

        // --- ANTREAN PENCAIRAN ---
        // DIPERBAIKI: dulu ada input nominal payout bebas diisi admin manual,
        // lalu dikirim apa adanya ke server (server versi lama percaya angka
        // ini mentah-mentah). Sekarang nominal SUDAH dihitung & dikunci
        // server-side (payout_amount, fee_persen_dipakai) - di sini cuma
        // ditampilkan, tidak bisa diedit. Admin cuma mengisi bukti transfer
        // sebagai jejak audit.
        const payoutContainer = document.getElementById('payout-rows');
        payoutQueue.forEach(p => {
            const deadline = new Date(p.dispute_deadline);
            const belumLewatDeadline = deadline > new Date();
            const row = document.createElement('div');
            row.className = 'bg-[#080c14] border border-slate-800 rounded-lg p-3 text-xs space-y-2';
            row.innerHTML = `
                <div class="flex items-center justify-between">
                    <p class="font-bold text-slate-200">${escapeHtml(p.id_transaksi)} — ${escapeHtml(p.nama_produk || '')}</p>
                    <p class="font-mono text-emerald-400 font-bold">${rupiah(p.payout_amount)} <span class="text-slate-500 font-normal">(fee ${p.fee_persen_dipakai}%)</span></p>
                </div>
                <p class="text-slate-500 font-mono">Selesai: ${new Date(p.selesai_at).toLocaleString('id-ID')} | Batas sengketa: ${deadline.toLocaleString('id-ID')}
                    ${belumLewatDeadline ? '<span class="text-amber-400">⚠ Belum lewat jendela sengketa</span>' : '<span class="text-emerald-400">✓ Aman dicairkan</span>'}
                </p>
                <div class="flex items-center gap-2">
                    <input type="text" placeholder="Bukti transfer (mis. BCA ref 12345)" class="bukti-transfer-input flex-1 bg-[#05070a] border border-slate-700 rounded px-2 py-1.5">
                    <button class="btn-payout-selesai bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1.5 font-bold" ${belumLewatDeadline ? 'title="Masih dalam jendela sengketa, disarankan tunggu"' : ''}>
                        ${belumLewatDeadline ? '⚠ Tandai Dibayar' : '✓ Tandai Dibayar'}
                    </button>
                </div>
            `;
            row.querySelector('.btn-payout-selesai').onclick = async () => {
                const bukti = row.querySelector('.bukti-transfer-input').value.trim();
                if (!bukti) { alert('Isi bukti transfer dulu (mis. nomor referensi transfer bank).'); return; }
                if (belumLewatDeadline && !confirm('Jendela sengketa 18 jam belum lewat. Tetap tandai sudah dibayar?')) return;
                try {
                    await apiFetch('/api/payout-selesai', { method: 'POST', body: JSON.stringify({ id_transaksi: p.id_transaksi, bukti_transfer: bukti }) });
                    renderMitraPanel(content);
                } catch (e) { alert('Gagal: ' + e.message); }
            };
            payoutContainer.appendChild(row);
        });

        const mitraContainer = document.getElementById('mitra-rows');
        mitraList.forEach(m => {
            const statusColor = m.status_verifikasi === 'TERVERIFIKASI' ? 'text-emerald-400' : m.status_verifikasi === 'DITOLAK' ? 'text-red-400' : 'text-amber-400';
            const row = document.createElement('div');
            row.className = 'bg-[#080c14] border border-slate-800 rounded-lg p-3 text-xs space-y-1';
            row.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="font-bold text-slate-200">${escapeHtml(m.nama)} <span class="text-slate-500 font-normal">(${escapeHtml(m.jenis_mitra)})</span></span>
                    <span class="font-mono ${statusColor}">${escapeHtml(m.status_verifikasi)}</span>
                </div>
                <p class="text-slate-500 font-mono">WA: ${escapeHtml(m.wa || '-')} | SIM: ${escapeHtml(m.no_sim || '-')} (${escapeHtml(m.kelas_sim || '-')}) | KIR s/d: ${escapeHtml(m.kir_berlaku_sampai || '-')}</p>
                <p class="text-slate-500 font-mono">Rekening: ${escapeHtml(m.nama_bank || '-')} ${escapeHtml(m.no_rekening || '-')} a/n ${escapeHtml(m.nama_pemilik_rekening || '-')} | Komisi platform: ${m.komisi_platform_persen}%</p>
                <div class="flex gap-2 pt-1">
                    <button class="btn-verify text-emerald-400 hover:underline">Set Terverifikasi</button>
                    <button class="btn-reject-mitra text-red-400 hover:underline">Set Ditolak</button>
                </div>
            `;
            row.querySelector('.btn-verify').onclick = async () => {
                await apiFetch('/api/mitra', { method: 'POST', body: JSON.stringify({ ...m, status_verifikasi: 'TERVERIFIKASI' }) });
                renderMitraPanel(content);
            };
            row.querySelector('.btn-reject-mitra').onclick = async () => {
                await apiFetch('/api/mitra', { method: 'POST', body: JSON.stringify({ ...m, status_verifikasi: 'DITOLAK' }) });
                renderMitraPanel(content);
            };
            mitraContainer.appendChild(row);
        });

        const mitraKurirContainer = document.getElementById('mitra-kurir-rows');
        mitraKurirList.forEach(m => {
            const statusColor = m.status_verifikasi === 'TERVERIFIKASI' ? 'text-emerald-400' : m.status_verifikasi === 'DITOLAK' ? 'text-red-400' : 'text-amber-400';
            const row = document.createElement('div');
            row.className = 'bg-[#080c14] border border-slate-800 rounded-lg p-3 text-xs space-y-1';
            row.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="font-bold text-slate-200">${escapeHtml(m.nama)} <span class="text-slate-500 font-normal">(${escapeHtml(m.kendaraan)})</span></span>
                    <span class="font-mono ${statusColor}">${escapeHtml(m.status_verifikasi)}</span>
                </div>
                <p class="text-slate-500 font-mono">WA: ${escapeHtml(m.wa || '-')} | Kota: ${escapeHtml(m.kota_domisili || '-')} | Radius: ${m.radius_layanan_km || '-'} km | Kapasitas: ${m.kapasitas_kg || '-'} kg</p>
                <p class="text-slate-500 font-mono">Rekening: ${escapeHtml(m.nama_bank || '-')} ${escapeHtml(m.no_rekening || '-')} a/n ${escapeHtml(m.nama_pemilik_rekening || '-')} | Komisi platform: ${m.komisi_platform_persen}%</p>
                ${m.catatan_verifikasi ? `<p class="text-slate-500 font-mono">Catatan: ${escapeHtml(m.catatan_verifikasi)}</p>` : ''}
                <div class="flex gap-2 pt-1 items-center">
                    <button class="btn-verify-kurir text-emerald-400 hover:underline">Set Terverifikasi</button>
                    <button class="btn-reject-kurir text-red-400 hover:underline">Set Ditolak</button>
                    <input type="text" class="catatan-kurir-input flex-1 bg-[#05070a] border border-slate-700 rounded px-2 py-1 font-mono" placeholder="Catatan (opsional, khusus saat tolak)">
                </div>
            `;
            row.querySelector('.btn-verify-kurir').onclick = async () => {
                await apiFetch('/api/mitra-kurir/verifikasi', { method: 'POST', body: JSON.stringify({ id: m.id, status_verifikasi: 'TERVERIFIKASI', catatan_verifikasi: '' }) });
                renderMitraPanel(content);
            };
            row.querySelector('.btn-reject-kurir').onclick = async () => {
                const catatan = row.querySelector('.catatan-kurir-input').value;
                await apiFetch('/api/mitra-kurir/verifikasi', { method: 'POST', body: JSON.stringify({ id: m.id, status_verifikasi: 'DITOLAK', catatan_verifikasi: catatan }) });
                renderMitraPanel(content);
            };
            mitraKurirContainer.appendChild(row);
        });

    } catch (e) {
        content.innerHTML = `<div class="text-center py-16 text-red-400 font-mono text-sm">Gagal memuat: ${escapeHtml(e.message)}</div>`;
    }
}

// ------------------ ITEM CARD (COL1: info + aksi | COL2: draft review) ------------------
function renderCategoryFields(item) {
    const k = item.kategori;
    if (k === 'Ekonomi' || k === 'Berita') {
        return `<p class="text-sm text-slate-400">ℹ️ ${escapeHtml(item.info_tambahan || '')}</p>`;
    }
    if (k === 'Pasar Modal') {
        return `
        <h4 class="text-sm font-bold text-emerald-400 mt-2">📈 Data Teknikal Pasar Modal</h4>
        ${item.ihsg ? `<div class="text-xs font-mono text-slate-400">IHSG/Harga Acuan: <span class="text-white font-bold">${escapeHtml(item.ihsg)}</span> <span class="text-emerald-400">${escapeHtml(item.perubahan_ihsg || '')}</span></div>` : ''}
        <label class="block text-xs text-slate-500 mt-2">RSI</label>
        <input data-field="rsi" value="${escapeHtml(item.rsi || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">MA20</label>
        <input data-field="ma20" value="${escapeHtml(item.ma20 || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-xs text-slate-500 mt-2">Support</label>
                <input data-field="support" value="${escapeHtml(item.support || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
            </div>
            <div>
                <label class="block text-xs text-slate-500 mt-2">Resistance</label>
                <input data-field="resistance" value="${escapeHtml(item.resistance || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
            </div>
        </div>
        <label class="block text-xs text-slate-500 mt-2">Sektor Terbaik</label>
        <input data-field="sektor_terbaik" value="${escapeHtml(item.sektor_terbaik || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">Sektor Terburuk</label>
        <input data-field="sektor_terburuk" value="${escapeHtml(item.sektor_terburuk || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">Saham Top Gainer</label>
        <input data-field="saham_top_gainer" value="${escapeHtml(item.saham_top_gainer || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">Saham Top Loser</label>
        <input data-field="saham_top_loser" value="${escapeHtml(item.saham_top_loser || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">News Trigger</label>
        <input data-field="news_trigger" value="${escapeHtml(item.news_trigger || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">Info Tambahan</label>
        <textarea data-field="info_tambahan" rows="3" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">${escapeHtml(item.info_tambahan || '')}</textarea>`;
    }
    if (k === 'Pariwisata') {
        return `<p class="text-sm text-slate-400">🏞️ <strong>Tempat:</strong> ${escapeHtml(item.nama_tempat || '-')}</p>
                <p class="text-sm text-slate-400">📍 <strong>Provinsi:</strong> ${escapeHtml(item.provinsi || '-')}</p>`;
    }
    if (k === 'Loker') {
        return `<p class="text-sm text-slate-400">🏢 <strong>Perusahaan:</strong> ${escapeHtml(item.penyelenggara_perusahaan || '-')}</p>`;
    }
    if (k === 'Tokoh Politik') {
        return `
        <h4 class="text-sm font-bold text-emerald-400 mt-2">🏛️ Profil Tokoh — Panggung Tokoh</h4>
        <label class="block text-xs text-slate-500 mt-2">👤 Tokoh / Jabatan Terkait</label>
        <input data-field="jabatan_tokoh" value="${escapeHtml(item.jabatan_tokoh || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">🎯 Fokus Kebijakan Publik</label>
        <input data-field="fokus_kebijakan" value="${escapeHtml(item.fokus_kebijakan || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">
        <label class="block text-xs text-slate-500 mt-2">📁 Klasifikasi Isu</label>
        <input data-field="isu_politik" value="${escapeHtml(item.isu_politik || '')}" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">

        <label class="block text-xs text-slate-500 mt-2">📝 Detail Peristiwa</label>
        <textarea data-field="info_tambahan" rows="3" class="field-input w-full bg-[#080c14] border border-slate-700 rounded px-2 py-1.5 text-xs">${escapeHtml(item.info_tambahan || '')}</textarea>`;

    return `<p class="text-sm text-slate-400">🏢 <strong>Sumber:</strong> ${escapeHtml(item.penyelenggara_perusahaan || '-')}</p>
            <p class="text-sm text-slate-400">ℹ️ ${escapeHtml(item.info_tambahan || '')}</p>`;
}

function renderCatatanRedaksi(item) {
    if (!['Ekonomi', 'Politik', 'Berita'].includes(item.kategori) || !item.artikel_ai) return '';
    let daftar = [];
    try {
        daftar = typeof item.catatan_redaksi === 'string' ? JSON.parse(item.catatan_redaksi) : (item.catatan_redaksi || []);
    } catch { daftar = []; }
    const checklist = daftar.length ? daftar.map(poin => `
        <label class="flex items-start gap-2 text-xs text-slate-400 py-1">
            <input type="checkbox" class="mt-0.5"> <span>${escapeHtml(poin)}</span>
        </label>`).join('') : '';
    const disclaimer = item.disclaimer ? `<p class="text-xs text-cyan-400/80 mt-2">🛡️ ${escapeHtml(item.disclaimer)}</p>` : '';
    return `<div class="border-t border-slate-800 mt-3 pt-3">
        <p class="text-[11px] font-mono text-slate-500 mb-1">📋 Sudah diracik AI — checklist sebelum terbit:</p>
        ${checklist}
        ${disclaimer}
    </div>`;
}

function renderItemCard(item, tabKey) {
    const sudahDiracikClaude = ['Ekonomi', 'Politik', 'Berita'].includes(item.kategori) && !!item.artikel_ai;
    const btnLabel = sudahDiracikClaude
        ? '📥 Muat Draft (0 token)'
        : (['Pasar Modal', 'Tokoh Politik'].includes(item.kategori) ? '📊 Racik Analisis AI' : '⚡ Susun Draft Konten');

    return `
    <div class="bg-[#0b0f17] border border-slate-800 rounded-xl p-5" id="card-${item.id}">
        <div class="grid md:grid-cols-[1.2fr_1.8fr] gap-6">
            <div>
                <h3 class="font-bold text-white mb-2">${escapeHtml(item.judul || '(tanpa judul)')}</h3>
                ${renderCategoryFields(item)}
                ${renderCatatanRedaksi(item)}
                ${item.link ? `<p class="text-[10px] font-mono text-slate-600 mt-2">Sumber Data Faktual: ${escapeHtml(item.link)}</p>` : ''}
                <div class="flex gap-2 mt-4">
                    <button class="btn-generate flex-1 bg-slate-800 hover:bg-slate-700 transition rounded-lg py-2 text-xs font-bold">${btnLabel}</button>
                    ${sudahDiracikClaude ? `<button class="btn-regen bg-slate-900 border border-slate-700 hover:border-amber-500 transition rounded-lg px-3 py-2 text-xs" title="Panggil AI lagi dari nol (pakai kuota API)">🔄 Racik Ulang</button>` : ''}
                    <button class="btn-reject bg-red-950/40 border border-red-900 hover:border-red-500 transition rounded-lg px-3 py-2 text-xs">🗑️ Tolak</button>
                </div>
            </div>
            <div class="draft-panel"></div>
        </div>
    </div>`;
}

function renderDraftPanel(item, draft) {
    const valLokasi = item.lokasi || item.dampak_wilayah || '';
    const valWa = item.link_wa || '';
    const valFoto = item.link_foto || item.foto_tokoh_url || '';
    return `
    <div class="space-y-3">
        <p class="text-sm font-bold">📝 Hasil Draft Review (Siap Terbit)</p>
        <textarea class="draft-json w-full bg-[#080c14] border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono h-40">${escapeHtml(JSON.stringify({ artikel: draft.artikel, caption_ig: draft.caption_ig, hook_tiktok: draft.hook_tiktok }, null, 2))}</textarea>
        <p class="json-status text-xs"></p>
        <input class="input-lokasi w-full bg-[#080c14] border border-slate-700 rounded-lg px-3 py-2 text-xs" placeholder="📍 Konfirmasi Lokasi Penerbitan" value="${escapeHtml(valLokasi)}">
        <input class="input-wa w-full bg-[#080c14] border border-slate-700 rounded-lg px-3 py-2 text-xs" placeholder="📱 Link WA Lamar/Info (Opsional)" value="${escapeHtml(valWa)}">
        <input class="input-foto w-full bg-[#080c14] border border-slate-700 rounded-lg px-3 py-2 text-xs" placeholder="🖼️ URL Foto Tokoh / Gambar Banner (Opsional)" value="${escapeHtml(valFoto)}">
        <button class="btn-publish w-full bg-emerald-600 hover:bg-emerald-500 transition rounded-lg py-2.5 text-sm font-bold">✅ Terbitkan Konten</button>
    </div>`;
}

function wireItemCard(item, tabKey) {
    const card = document.getElementById(`card-${item.id}`);
    if (!card) return;

    const doGenerate = async (forceRegenerate) => {
        const overrides = {};
        card.querySelectorAll('.field-input').forEach(el => { overrides[el.dataset.field] = el.value; });
        const btn = forceRegenerate ? card.querySelector('.btn-regen') : card.querySelector('.btn-generate');
        const originalLabel = btn.textContent;
        btn.disabled = true; btn.textContent = '⏳ Memproses...';
        try {
            const draft = await apiFetch('/api/generate', {
                method: 'POST',
                body: JSON.stringify({ id: item.id, force_regenerate: forceRegenerate, overrides }),
            });
            card.querySelector('.draft-panel').innerHTML = renderDraftPanel(item, draft);
            wireDraftPanel(item, card);
        } catch (e) {
            alert('Gagal: ' + e.message);
        } finally {
            btn.disabled = false; btn.textContent = originalLabel;
        }
    };

    card.querySelector('.btn-generate').onclick = () => doGenerate(false);
    const regenBtn = card.querySelector('.btn-regen');
    if (regenBtn) regenBtn.onclick = () => doGenerate(true);

    card.querySelector('.btn-reject').onclick = async () => {
        if (!confirm('Tolak konten ini?')) return;
        try {
            await apiFetch('/api/reject', { method: 'POST', body: JSON.stringify({ id: item.id }) });
            QUEUE = QUEUE.filter(d => d.id !== item.id);
            renderTabs(); renderActiveTab();
        } catch (e) { alert('Gagal menolak: ' + e.message); }
    };
}

function wireDraftPanel(item, card) {
    const textarea = card.querySelector('.draft-json');
    const status = card.querySelector('.json-status');
    const publishBtn = card.querySelector('.btn-publish');

    const validate = () => {
        try {
            JSON.parse(textarea.value);
            status.textContent = '✅ Format JSON Valid';
            status.className = 'json-status text-xs text-emerald-400';
            publishBtn.disabled = false;
            return true;
        } catch (e) {
            status.textContent = '❌ JSON Error: periksa tanda petik/koma yang hilang';
            status.className = 'json-status text-xs text-red-400';
            publishBtn.disabled = true;
            return false;
        }
    };
    textarea.addEventListener('input', validate);
    validate();

    publishBtn.onclick = async () => {
        if (!validate()) return;
        const parsed = JSON.parse(textarea.value);
        publishBtn.disabled = true; publishBtn.textContent = '⏳ Menerbitkan...';
        try {
            await apiFetch('/api/publish', {
                method: 'POST',
                body: JSON.stringify({
                    id: item.id,
                    artikel: parsed.artikel || '',
                    caption_ig: parsed.caption_ig || '',
                    hook_tiktok: parsed.hook_tiktok || '',
                    lokasi: card.querySelector('.input-lokasi').value,
                    link_wa: card.querySelector('.input-wa').value,
                    link_foto: card.querySelector('.input-foto').value,
                }),
            });
            QUEUE = QUEUE.filter(d => d.id !== item.id);
            renderTabs(); renderActiveTab();
        } catch (e) {
            alert('Gagal menerbitkan: ' + e.message);
            publishBtn.disabled = false; publishBtn.textContent = '✅ Terbitkan Konten';
        }
    };
}

// ------------------ INIT ------------------
function showApp() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    loadQueue();
}

document.getElementById('login-btn').onclick = doLogin;
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logout-btn').onclick = logout;
document.getElementById('refresh-btn').onclick = loadQueue;

if (TOKEN) {
    showApp();
}
</script>
